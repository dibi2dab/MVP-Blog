name: detect

on:
  workflow_run:
    workflows: [collect]
    types: [completed]
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Detect
        run: python main.py detect
        env:
          MOCK_MODE: true