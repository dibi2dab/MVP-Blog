name: editorial

# Crystal (rumbell) / Quartz (quar1z) Korean editorial publishing.
#
# This workflow is intentionally separate from `scheduled.yml`:
#   - Obsidian (eneru) keeps its existing stock pipeline, settings, and schedule.
#   - Crystal and Quartz use the deterministic editorial engine in `src/editorial`.
#
# There is no AI provider in this path. Generation reads the curated catalog in
# `data/editorial/<blog>/catalog.yaml`, calculates metrics with Python, and writes
# structured queue files. Publishing re-validates those files, re-runs the
# deterministic quality gate, and only then uses the existing Node/Tistory engine.

on:
  schedule:
    # 매일 10:00 KST (01:00 UTC)
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      blog:
        description: "Which blog to run"
        type: choice
        options:
          - all
          - crystal
          - quartz
        default: all
      dry_run:
        description: "Generate and validate without publishing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: editorial-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        blog: [crystal, quartz]

    env:
      BLOG: ${{ matrix.blog }}

    steps:
      - name: Decide whether this matrix leg should run
        id: gate
        run: |
          requested="${{ github.event.inputs.blog || 'all' }}"
          if [ "$requested" = "all" ] || [ "$requested" = "${{ matrix.blog }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate catalog
        if: steps.gate.outputs.run == 'true'
        run: python -m src.editorial.cli validate --blog "$BLOG"

      - name: Generate articles
        if: steps.gate.outputs.run == 'true'
        run: python -m src.editorial.cli generate --blog "$BLOG"

      - name: Upload generated queue
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-${{ matrix.blog }}-${{ github.run_id }}
          path: data/blogs/${{ matrix.blog }}
          if-no-files-found: ignore

  publish:
    needs: generate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        blog: [crystal, quartz]

    env:
      BLOG: ${{ matrix.blog }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

      # Blog-specific secrets. Empty values fall back to TISTORY_* in code.
      CRYSTAL_BLOG_NAME: ${{ secrets.CRYSTAL_BLOG_NAME }}
      CRYSTAL_BLOG_URL: ${{ secrets.CRYSTAL_BLOG_URL }}
      CRYSTAL_STORAGE_STATE_PATH: ${{ secrets.CRYSTAL_STORAGE_STATE_PATH }}
      CRYSTAL_KAKAO_ID: ${{ secrets.CRYSTAL_KAKAO_ID }}
      CRYSTAL_KAKAO_PASSWORD: ${{ secrets.CRYSTAL_KAKAO_PASSWORD }}
      # Editorial posts are public by default, independent of Obsidian's
      # TISTORY_VISIBILITY (which may be private). Override per blog if needed.
      CRYSTAL_VISIBILITY: ${{ secrets.CRYSTAL_VISIBILITY || 'public' }}
      CRYSTAL_TISTORY_CATEGORY: ${{ secrets.CRYSTAL_TISTORY_CATEGORY }}
      CRYSTAL_MAX_ARTICLES_PER_DAY: ${{ secrets.CRYSTAL_MAX_ARTICLES_PER_DAY }}
      CRYSTAL_MIN_QUALITY_SCORE: ${{ secrets.CRYSTAL_MIN_QUALITY_SCORE }}
      CRYSTAL_MIN_SOURCES: ${{ secrets.CRYSTAL_MIN_SOURCES }}

      QUARTZ_BLOG_NAME: ${{ secrets.QUARTZ_BLOG_NAME }}
      QUARTZ_BLOG_URL: ${{ secrets.QUARTZ_BLOG_URL }}
      QUARTZ_STORAGE_STATE_PATH: ${{ secrets.QUARTZ_STORAGE_STATE_PATH }}
      QUARTZ_KAKAO_ID: ${{ secrets.QUARTZ_KAKAO_ID }}
      QUARTZ_KAKAO_PASSWORD: ${{ secrets.QUARTZ_KAKAO_PASSWORD }}
      QUARTZ_VISIBILITY: ${{ secrets.QUARTZ_VISIBILITY || 'public' }}
      QUARTZ_TISTORY_CATEGORY: ${{ secrets.QUARTZ_TISTORY_CATEGORY }}
      QUARTZ_MAX_ARTICLES_PER_DAY: ${{ secrets.QUARTZ_MAX_ARTICLES_PER_DAY }}
      QUARTZ_MIN_QUALITY_SCORE: ${{ secrets.QUARTZ_MIN_QUALITY_SCORE }}
      QUARTZ_MIN_SOURCES: ${{ secrets.QUARTZ_MIN_SOURCES }}

      TISTORY_KAKAO_ID: ${{ secrets.TISTORY_KAKAO_ID }}
      TISTORY_KAKAO_PASSWORD: ${{ secrets.TISTORY_KAKAO_PASSWORD }}

    steps:
      - name: Decide whether this matrix leg should run
        id: gate
        run: |
          requested="${{ github.event.inputs.blog || 'all' }}"
          if [ "$requested" = "all" ] || [ "$requested" = "${{ matrix.blog }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "20"

      - name: Install Python dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node publish engine
        if: steps.gate.outputs.run == 'true'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Download generated queue
        if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: editorial-${{ matrix.blog }}-${{ github.run_id }}
          path: data/blogs/${{ matrix.blog }}

      - name: Restore Tistory session
        if: steps.gate.outputs.run == 'true'
        env:
          CRYSTAL_STORAGE_STATE: ${{ secrets.CRYSTAL_STORAGE_STATE }}
          QUARTZ_STORAGE_STATE: ${{ secrets.QUARTZ_STORAGE_STATE }}
          TISTORY_STORAGE_STATE: ${{ secrets.TISTORY_STORAGE_STATE }}
        run: |
          mkdir -p .state
          blog="$BLOG"
          upper=$(echo "$blog" | tr '[:lower:]' '[:upper:]')
          eval "specific=\${${upper}_STORAGE_STATE}"
          state="${specific:-$TISTORY_STORAGE_STATE}"
          if [ -z "$state" ]; then
            echo "No session secret for $blog. Set ${upper}_STORAGE_STATE or TISTORY_STORAGE_STATE." >&2
            exit 1
          fi
          echo "$state" | base64 --decode > ".state/${blog}_storage_state.json"

      - name: Verify session (auto-relogin if possible)
        if: steps.gate.outputs.run == 'true'
        run: npm run session:check -- --blog "$BLOG"

      - name: Publish validated articles
        if: steps.gate.outputs.run == 'true'
        run: |
          args=(--blog "$BLOG")
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python -m src.editorial.cli publish "${args[@]}"

      - name: Upload run reports and drafts
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-reports-${{ matrix.blog }}-${{ github.run_id }}
          path: |
            data/blogs/${{ matrix.blog }}/runs/
            data/blogs/${{ matrix.blog }}/drafts/
            artifacts/tistory-errors/${{ matrix.blog }}/
          if-no-files-found: ignore

      - name: Commit publication state
        if: always() && steps.gate.outputs.run == 'true' && env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "data/blogs/${BLOG}/published.json" "data/blogs/${BLOG}/queue" "content/${BLOG}" || true
          if git diff --cached --quiet; then
            echo "No publication state changes to commit."
            exit 0
          fi
          git commit -m "chore(${BLOG}): editorial run $(date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            else
              git rebase --abort || true
            fi
            sleep 5
          done
          echo "Failed to push publication state after retries." >&2
          exit 1

      - name: Cleanup session
        if: steps.gate.outputs.run == 'true' && always()
        run: rm -rf .state
