  price:
    provider: naver          # naver | mock
    endpoint: "https://api.stock.naver.com/chart/domestic/item/{code}/day"
    period_count: 90
    timeout_seconds: 15

news:
  provider: google_rss       # google_rss | naver | mock
  google_rss:
    base_url: "https://news.google.com/rss/search"
    lang: ko
    country: KR
    max_items: 40
  naver:
    search_url: "https://search.naver.com/search.naver"

disclosures:
  provider: dart             # dart | mock
  dart:
    base_url: "https://opendart.fss.or.kr/api"
    endpoint_list: "/list.json"
    endpoint_corp: "/corpCode.xml"
    api_key_env: DART_API_KEY
    report_type: XBRL
    max_items: 50

economy:
  enabled: false

realestate:
  enabled: false