  - id: adsense-blog
    name: 구글 애드센스 블로그 수익
    category: 블로그 수익화
    title: 구글 애드센스 블로그 수익, 월 3만 방문이면 얼마 남을까
    meta_description: "구글 애드센스 블로그에서 월 3만 방문과 RPM 3,000원을 가정해 예상 매출, 운영 비용, 순이익, ROI, 손익분기, 시간당 수익을 계산하고 수익 변동 위험과 시작 전 체크리스트를 정리했습니다."
    primary_keyword: 애드센스
    secondary_keywords:
      - 블로그 수익
      - RPM
      - 광고 수익
    tags:
      - 애드센스
      - 블로그 수익화
      - 온라인 수익
      - RPM
    summary: "구글 애드센스 블로그 수익은 방문자 수, RPM, 광고 채움률에 따라 크게 달라집니다. 월 3만 방문과 RPM 3,000원을 기준으로 실제로 남는 금액을 계산했습니다."
    why_now: "광고 단가와 플랫폼 정책이 자주 바뀌어, 방문자 수만 보고 수익을 예상하면 실제 정산액과 차이가 날 수 있습니다."
    model:
      type: advertising
      inputs:
        monthly_pageviews: 30000
        rpm_krw: 3000
        fill_rate: 0.9
      initial_investment_krw: 300000
      fixed_monthly_krw: 20000
      variable_cost_per_unit_krw: 0
      monthly_hours: 24
      scenarios:
        conservative: 0.5
        base: 1.0
        optimistic: 1.5
    ratings:
      revenue_variability_risk:
        score: 6.0
        basis: "광고 단가는 계절, 광고주 예산, 플랫폼 정책에 따라 변동하므로 같은 방문자 수에서도 월 수익이 달라질 수 있습니다."
        source_ids: [S1, S2]
      operational_difficulty:
        score: 5.0
        basis: "글 작성과 검색 유입 관리가 꾸준히 필요하지만, 결제·재고·고객 응대 부담은 상대적으로 작습니다."
        source_ids: [S1]
      long_term_sustainability:
        score: 7.0
        basis: "검색 유입 자산은 오래 유지될 수 있으나, 플랫폼 정책과 검색 알고리즘 변화에 대한 대비가 필요합니다."
        source_ids: [S1, S2]
    sources:
      - id: S1
        title: "How AdSense revenue is shared"
        url: https://support.google.com/adsense/answer/180195
        publisher: Google AdSense 공식 도움말
        accessed_at: "2026-11-07"
      - id: S2
        title: "AdSense program policies"
        url: https://support.google.com/adsense/answer/48182
        publisher: Google AdSense 공식 도움말
        accessed_at: "2026-11-07"
      - id: S3
        title: "Google AdSense 시작하기"
        url: https://adsense.google.com/start/
        publisher: Google AdSense 공식
        accessed_at: "2026-11-07"
    sourced_inputs: {}
    assumptions:
      - name: 세금과 본인 부담 비용
        value: "계산에서 제외"
        unit: ""
        basis: 편집상 가정
      - name: 광고 수익 정산 통화
        value: "원화 환산 기준"
        unit: ""
        basis: 편집상 가정
    limitations:
      - "RPM과 광고 채움률은 독자의 주제, 국가, 기기 비중에 따라 크게 달라지는 편집상 가정입니다."
      - "애드센스 정책 위반이나 계정 정지 가능성은 계산에 포함하지 않았습니다."
    checklist:
      - "월 방문자 수와 실제 RPM을 애드센스 보고서에서 확인했는가"
      - "광고 채움률과 정책 위반 위험을 점검했는가"
      - "콘텐츠 제작에 들어가는 월 시간을 실제로 확보할 수 있는가"
      - "수익이 0원인 달에도 버틸 수 있는 기간을 계산했는가"
      - "중단하거나 주제를 바꿀 기준을 정해 두었는가"
    last_reviewed: "2026-11-07"
    status: active

  - id: gumroad-digital-product
    name: Gumroad 디지털 상품 판매 수익
    category: 디지털 상품
    title: Gumroad 디지털 상품 판매, 수수료 떼고 얼마나 남을까
    meta_description: "Gumroad에서 2만원 디지털 상품을 월 20개 판매할 때 플랫폼 수수료와 건당 비용을 반영해 매출, 순이익, ROI, 시간당 수익, 손익분기를 계산했습니다."
    primary_keyword: 디지털 상품 판매
    secondary_keywords:
      - Gumroad 수수료
      - 디지털 상품 수익
      - 온라인 판매
    tags:
      - Gumroad
      - 디지털 상품
      - 온라인 수익
      - 수수료
    summary: "Gumroad 디지털 상품 판매는 판매가와 수수료 구조를 함께 봐야 실제 수익이 보입니다. 2만원 상품을 월 20개 판매하는 조건으로 비용과 순이익을 계산했습니다."
    why_now: "디지털 상품은 재고 없이 시작할 수 있지만, 플랫폼 수수료와 환불·세금 정책을 반영하지 않으면 기대 수익과 실제 입금액이 달라집니다."
    model:
      type: digital_product
      inputs:
        price_per_unit_krw: 20000
        units_per_month: 20
        platform_fee_rate: 0.10
      initial_investment_krw: 100000
      fixed_monthly_krw: 0
      variable_cost_per_unit_krw: 700
      monthly_hours: 10
      scenarios:
        conservative: 0.5
        base: 1.0
        optimistic: 1.5
    ratings:
      revenue_variability_risk:
        score: 7.0
        basis: "판매량이 콘텐츠 노출과 구매 전환에 따라 크게 달라지고, 환불과 할인 정책도 수익에 영향을 줍니다."
        source_ids: [S1, S3]
      operational_difficulty:
        score: 4.0
        basis: "상품 제작과 고객 지원은 필요하지만, 재고·배송·물류 운영 부담은 없습니다."
        source_ids: [S2]
      long_term_sustainability:
        score: 6.0
        basis: "한 번 만든 상품을 반복 판매할 수 있으나, 시장 유행과 경쟁 상품에 따라 판매량이 줄 수 있습니다."
        source_ids: [S1, S2]
    sources:
      - id: S1
        title: "Gumroad pricing"
        url: https://gumroad.com/pricing
        publisher: Gumroad 공식
        accessed_at: "2026-11-07"
      - id: S2
        title: "Gumroad features"
        url: https://gumroad.com/features
        publisher: Gumroad 공식
        accessed_at: "2026-11-07"
      - id: S3
        title: "Gumroad terms of service"
        url: https://gumroad.com/terms
        publisher: Gumroad 공식
        accessed_at: "2026-11-07"
    sourced_inputs:
      platform_fee_rate: [S1]
    assumptions:
      - name: 건당 결제 수수료
        value: "700"
        unit: 원/건
        basis: "편집상 가정 — 공식 0.50달러를 1,400원 환율로 환산"
      - name: 환율
        value: "1,400"
        unit: 원/달러
        basis: 편집상 가정
      - name: 세금과 소득 신고 비용
        value: "계산에서 제외"
        unit: ""
        basis: 편집상 가정
    limitations:
      - "플랫폼 수수료율과 건당 수수료는 판매 경로와 결제 방식에 따라 달라질 수 있습니다."
      - "월 20개 판매량은 실제 시장 수요가 아니라 계산을 위한 편집상 가정입니다."
    checklist:
      - "판매 경로별 수수료율과 건당 수수료를 공식 가격표에서 확인했는가"
      - "환불·세금·정산 주기를 확인했는가"
      - "상품 제작과 고객 지원에 들어가는 시간을 계산했는가"
      - "판매가 인상 또는 할인 기준을 정했는가"
      - "판매가 부진할 때 중단할 기준을 정했는가"
    last_reviewed: "2026-11-07"
    status: active

